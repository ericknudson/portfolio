<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<!-- Emoji-style Eric: black ball cap, round tortoiseshell glasses, short brown beard, big smile. -->
	<!-- Ears -->
	<ellipse cx="11.5" cy="37" rx="3.8" ry="5.2" fill="#E9B48E" />
	<ellipse cx="52.5" cy="37" rx="3.8" ry="5.2" fill="#E9B48E" />
	<!-- Face -->
	<ellipse cx="32" cy="38" rx="20" ry="22" fill="#F4C7A1" />
	<!-- Short beard along the jaw and chin, cheeks left bare -->
	<path d="M12.6 40 C13.5 52 21 59.5 32 59.5 C43 59.5 50.5 52 51.4 40 C49.5 45 47 48.5 43 49.5 C40 46.5 36 45.8 32 45.8 C28 45.8 24 46.5 21 49.5 C17 48.5 14.5 45 12.6 40 Z" fill="#9A6644" />
	<!-- Mustache -->
	<path d="M22.5 48.5 C25.5 45 29 44.6 32 45.8 C35 44.6 38.5 45 41.5 48.5 C38 47.6 35 47.8 32 48.4 C29 47.8 26 47.6 22.5 48.5 Z" fill="#87573A" />
	<!-- Smile with teeth -->
	<path d="M25 49.6 C27 54.6 37 54.6 39 49.6 Z" fill="#FFFFFF" stroke="#5A3522" stroke-width="1.2" stroke-linejoin="round" />
	<!-- Cap crown (outlined so it still shows on dark tab bars) -->
	<path d="M11.5 27 C11.5 13.5 20.5 6.5 32 6.5 C43.5 6.5 52.5 13.5 52.5 27 Z" fill="#232327" stroke="#4A4A52" stroke-width="1.2" stroke-linejoin="round" />
	<!-- Brim, seen from the front: a wider curved bill over the forehead -->
	<path d="M8 27.5 C8 25.5 9.5 24.5 12 24.5 L52 24.5 C54.5 24.5 56 25.5 56 27.5 C56 30 51 31.5 32 31.5 C13 31.5 8 30 8 27.5 Z" fill="#2E2E33" stroke="#4A4A52" stroke-width="1.2" stroke-linejoin="round" />
	<!-- Button on top and a center seam -->
	<circle cx="32" cy="7.6" r="1.5" fill="#4A4A52" />
	<path d="M32 9 L32 24" stroke="#3A3A40" stroke-width="1" />
	<!-- Eyes (happy, slightly squinted) -->
	<path d="M20 39.5 C21.2 37.8 24 37.8 25.2 39.5" fill="none" stroke="#2A1C14" stroke-width="2" stroke-linecap="round" />
	<path d="M38.8 39.5 C40 37.8 42.8 37.8 44 39.5" fill="none" stroke="#2A1C14" stroke-width="2" stroke-linecap="round" />
	<!-- Glasses: round tortoiseshell frames, bridge, temples -->
	<circle cx="22.6" cy="39" r="6.8" fill="none" stroke="#5B3020" stroke-width="2.4" />
	<circle cx="41.4" cy="39" r="6.8" fill="none" stroke="#5B3020" stroke-width="2.4" />
	<path d="M29.4 38.2 C30.7 36.8 33.3 36.8 34.6 38.2" fill="none" stroke="#5B3020" stroke-width="2" />
	<path d="M15.8 38 L12.8 36.6 M48.2 38 L51.2 36.6" stroke="#5B3020" stroke-width="2" stroke-linecap="round" />
	<!-- Nose -->
	<path d="M32 41.2 C30.8 43 31 44 32.6 44" fill="none" stroke="#D99B74" stroke-width="1.4" stroke-linecap="round" />
</svg>
